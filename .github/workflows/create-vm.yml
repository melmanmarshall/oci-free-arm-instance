name: Try to Create OCI VM

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: "Lpwo:AP-TOKYO-1-AD-1"
  OCI_CLI_REGION: "ap-tokyo-1"
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  INSTANCE_NAME: "anjian-arm"
  OCPUS: "4"
  MEMORY_GB: "24"
  BOOT_VOLUME_GB: "100"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        continue-on-error: true
        run: |
          set -o pipefail

          pip install oci-cli

          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_CLI_USER }}"
            echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}"
            echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}"
            echo "key_file=$HOME/.oci/oci_api_key.pem"
            echo "region=${{ env.OCI_CLI_REGION }}"
          } > ~/.oci/config
          chmod 600 ~/.oci/config

          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

          # ---- Guard: never create a second free-tier instance ----
          # The Always Free allowance is 4 OCPU / 24 GB total. If an A1.Flex
          # instance already exists, a second one would be billable.
          EXISTING=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --query "length(data[?shape=='VM.Standard.A1.Flex' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" \
            --raw-output 2>/dev/null || echo "0")

          if [ "$EXISTING" != "0" ] && [ -n "$EXISTING" ]; then
            echo "An A1.Flex instance already exists (count=$EXISTING). Nothing to do."
            echo "log_data<<EOF" >> $GITHUB_OUTPUT
            echo "Instance already exists (count=$EXISTING) — skipped. You can disable this workflow." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ---- Resolve the newest Ubuntu 24.04 image that fits this shape ----
          # Filtering by --shape guarantees an aarch64 build. Looking it up at
          # run time avoids a hardcoded OCID going stale as Canonical rebuilds.
          IMAGE_ID=$(oci compute image list \
            --compartment-id "$COMPARTMENT_ID" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "24.04" \
            --shape "VM.Standard.A1.Flex" \
            --sort-by TIMECREATED --sort-order DESC \
            --query 'data[0].id' --raw-output)

          if [ -z "$IMAGE_ID" ]; then
            echo "Could not resolve an Ubuntu 24.04 aarch64 image."
            exit 1
          fi
          echo "Using image: $IMAGE_ID"

          OCI_OUTPUT=$(oci compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config "{\"ocpus\":$OCPUS,\"memoryInGBs\":$MEMORY_GB}" \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "$INSTANCE_NAME" \
            --boot-volume-size-in-gbs "$BOOT_VOLUME_GB" 2>&1 || true)

          echo "log_data<<EOF" >> $GITHUB_OUTPUT
          echo "$OCI_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "Success! 'PROVISIONING' state found in output."
            exit 0
          else
            echo "Not created yet (most likely Out of host capacity)."
            exit 1
          fi

      - name: Report public IP on success
        if: steps.create_vm.outcome == 'success'
        run: |
          echo "Waiting for the VNIC to get its public IP..."
          for i in $(seq 1 12); do
            IP=$(oci compute instance list-vnics \
              --compartment-id "$COMPARTMENT_ID" \
              --query "data[0].\"public-ip\"" --raw-output 2>/dev/null || true)
            if [ -n "$IP" ] && [ "$IP" != "null" ]; then
              echo "PUBLIC IP: $IP"
              echo "### VM ready — ssh ubuntu@$IP" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            sleep 10
          done
          echo "Instance created, but no public IP reported yet. Check the OCI console."

      - name: Send Discord Notification
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "OCI VM Status: ${{ steps.create_vm.outcome }}"
          status: ${{ steps.create_vm.outcome }}
          color: ${{ steps.create_vm.outcome == 'success' && '0x28a745' || '0xdc3545' }}
          description: |
            Attempt to create A1.Flex VM (Tokyo, 4 OCPU / 24 GB).
            **Status:** `${{ steps.create_vm.outcome }}`

            **Log Output:**
            ```json
            ${{ steps.create_vm.outputs.log_data }}
            ```
